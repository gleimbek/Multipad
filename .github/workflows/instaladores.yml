# Genera los instaladores de Multipad y los publica en GitHub Releases.
# Para publicar una versión: crea el release en GitHub con una etiqueta que empiece con "v" (por ejemplo v1.3.0),
# o crea la etiqueta y súbela (git tag v1.3.0 && git push origin v1.3.0); si el release no existe, se crea solo.
# Cada instalador se sube al release apenas termina, así una demora en uno (por ejemplo, la Mac) no retiene a los demás.
# En cada pull request también se generan, para comprobar que compilan.
# También se puede correr a mano desde la pestaña Actions; en ese caso solo genera los archivos
# (aparecen como "artifacts" de la ejecución) sin crear un release.
name: Instaladores

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escritorio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            file: dist/Multipad-Setup.exe
          - os: macos-latest
            flag: --mac
            file: dist/Multipad.dmg
          - os: ubuntu-latest
            flag: --linux
            file: dist/Multipad.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error
      - name: Subir al release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Si el release todavía no existe, lo crea el primer instalador que termina; si otro lo crea al mismo tiempo, se sigue igual.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Multipad ${TAG#v}" --generate-notes \
            || true
          gh release upload "$TAG" "${{ matrix.file }}" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node tools/android-www.js
      - run: npx cap add android
      - name: Íconos de la app (desde assets/)
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b1020' --splashBackgroundColor '#0b1020'
      - run: npx cap sync android
      - name: Compilar el .apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Multipad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-android
          path: Multipad.apk
          if-no-files-found: error
      - name: Subir al release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Si el release todavía no existe, lo crea el primer instalador que termina; si otro lo crea al mismo tiempo, se sigue igual.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Multipad ${TAG#v}" --generate-notes \
            || true
          gh release upload "$TAG" "Multipad.apk" --repo "$GITHUB_REPOSITORY" --clobber
