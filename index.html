<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>MultiPad</title>
  <meta name="description" content="Editor de código con pestañas, paneles divididos y varias ventanas. Funciona en computadora, tablet y celular.">
  <meta name="theme-color" content="#16191d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" id="btnSidebar" title="Panel lateral (Ctrl+B)" aria-label="Panel lateral">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z M9 5v14" /></svg>
      </button>
      <nav id="menubar" aria-label="Menú principal">
        <button class="menu-btn" data-menu="archivo">Archivo</button>
        <button class="menu-btn" data-menu="editar">Editar</button>
        <button class="menu-btn" data-menu="ver">Ver</button>
        <button class="menu-btn" data-menu="ventana">Ventana</button>
        <button class="menu-btn" data-menu="ayuda">Ayuda</button>
      </nav>
      <div id="quick">
        <button class="icon-btn" data-cmd="new" title="Nuevo (Alt+N)" aria-label="Nuevo">
          <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M12 11v6 M9 14h6" /></svg>
        </button>
        <button class="icon-btn" data-cmd="open" title="Abrir (Ctrl+O)" aria-label="Abrir">
          <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z" /></svg>
        </button>
        <button class="icon-btn" data-cmd="save" title="Guardar (Ctrl+S)" aria-label="Guardar">
          <svg viewBox="0 0 24 24"><path d="M5 3h12l2 2v16H5z M8 3v5h8V3 M8 14h8v7H8z" /></svg>
        </button>
        <span class="sep"></span>
        <button class="icon-btn" data-cmd="splitRight" title="Dividir a la derecha (Ctrl+\)" aria-label="Dividir a la derecha">
          <svg viewBox="0 0 24 24"><path d="M3 4h18v16H3z M12 4v16" /></svg>
        </button>
        <button class="icon-btn" data-cmd="splitDown" title="Dividir abajo" aria-label="Dividir abajo">
          <svg viewBox="0 0 24 24"><path d="M3 4h18v16H3z M3 12h18" /></svg>
        </button>
        <button class="icon-btn" data-cmd="newWindow" title="Ventana nueva (Alt+Shift+N)" aria-label="Ventana nueva">
          <svg viewBox="0 0 24 24"><path d="M8 3h13v11H8z M8 7h13 M5 8H3v13h13v-2" /></svg>
        </button>
        <button class="icon-btn" data-cmd="otherScreen" title="Ventana en otra pantalla" aria-label="Ventana en otra pantalla">
          <svg viewBox="0 0 24 24"><path d="M2 4h9v7H2z M13 9h9v7h-9z M5 14v3h4 M16 16v3h3" /></svg>
        </button>
      </div>
      <div id="winLabel" title="Nombre de esta ventana (clic para renombrar)"></div>
    </header>

    <div id="main">
      <aside id="sidebar" hidden>
        <section class="side-section">
          <div class="side-head">
            <span>Carpetas</span>
            <button class="icon-btn small" data-cmd="openFolder" title="Abrir carpeta" aria-label="Abrir carpeta">
              <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z M12 12v5 M9.5 14.5h5" /></svg>
            </button>
          </div>
          <div id="folderTree" class="tree"></div>
        </section>
        <section class="side-section grow">
          <div class="side-head">
            <span>Documentos del espacio</span>
          </div>
          <div id="docList" class="doclist"></div>
        </section>
      </aside>
      <div id="panes"></div>
    </div>

    <div id="mobileKeys" hidden>
      <button data-key="tab">⇥</button>
      <button data-ins="{}">{ }</button>
      <button data-ins="()">( )</button>
      <button data-ins="[]">[ ]</button>
      <button data-ins="<>">&lt; &gt;</button>
      <button data-ins=";">;</button>
      <button data-ins="=">=</button>
      <button data-ins="&quot;&quot;">" "</button>
      <button data-ins="''">' '</button>
      <button data-ins="/">/</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="undo">↶</button>
      <button data-key="redo">↷</button>
      <button data-key="find">Buscar</button>
    </div>

    <footer id="statusbar">
      <span id="stPos">Ln 1, Col 1</span>
      <span id="stSel"></span>
      <span class="grow"></span>
      <button id="stIndent" class="st-btn" title="Tamaño de tabulación"></button>
      <button id="stEol" class="st-btn" title="Fin de línea"></button>
      <span>UTF-8</span>
      <button id="stLang" class="st-btn" title="Lenguaje"></button>
    </footer>
  </div>

  <div id="menuLayer"></div>
  <div id="modalLayer" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
